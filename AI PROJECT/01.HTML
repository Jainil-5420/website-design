<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Envato-style Product Landing + Notes Manager</title>
    <link rel="stylesheet" href="02.CSS">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1 class="logo">MarketKit</h1>
            <nav class="nav">
                <a href="#products">Products</a>
                <a href="#notes">Notes</a>
                <a href="#about">About</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- HERO -->
        <section class="hero container" id="home">
            <div>
                <h2>Premium Templates & Themes</h2>
                <p>Create beautiful sites with high-converting templates. Built for creators & agencies.</p>
                <div class="cta-row">
                    <a class="btn" href="#products">Browse Products</a>
                    <a class="btn btn-ghost" href="#notes">Open Notes Manager</a>
                </div>
            </div>
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='250'><rect width='100%' height='100%' fill='%23e9f2ff'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='18' fill='%23636' font-family='Arial'>Product Preview</text></svg>"
                alt="preview">
        </section>

        <!-- PRODUCTS GRID -->
        <section id="products" class="container section">
            <h3>Featured Products</h3>
            <div class="grid" id="productGrid">
                <!-- Cards inserted statically here (example) -->
                <article class="card">
                    <img alt="Theme thumbnail"
                        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='200'><rect width='100%' height='100%' fill='%23f6f8fb'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='16' fill='%23999'>Theme A</text></svg>">
                    <h4>Multipurpose Theme</h4>
                    <p class="muted">Perfect for startup landing pages. 5 demos included.</p>
                    <div class="card-meta">
                        <span>₹1,499</span>
                        <button class="btn small">Buy</button>
                    </div>
                </article>

                <article class="card">
                    <img alt="Plugin thumbnail"
                        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='200'><rect width='100%' height='100%' fill='%23fff8e6'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='16' fill='%23999
